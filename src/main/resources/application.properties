spring.application.name=mafia-game

# Database Configuration (Defaults to local MySQL, supports overriding to PostgreSQL/Supabase via env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mafia_game}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hithesh@1768}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}

# JWT Secret (Supports JWT_SECRET env var override in production)
jwt.secret=${JWT_SECRET:my-super-secret-key-for-mafia-game-123456-change-in-production}
